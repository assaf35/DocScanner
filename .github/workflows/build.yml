name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Unzip project
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -q -o "$z"; done
          PROJ=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")
          echo "Project folder: $PROJ"
          echo "PROJ=$PROJ" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > "$PROJ/local.properties"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: cd "$PROJ" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DocScanner-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
